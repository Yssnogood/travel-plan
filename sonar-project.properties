# SonarQube Configuration for Travel Plan
sonar.projectKey=travel-plan
sonar.projectName=Travel Plan
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=services/auth-service/src/main/java,services/user-service/src/main/java,services/travel-service/src/main/java,services/payment-service/src/main/java,services/notification-service/src/main/java,services/shared-lib/src/main/java

# Test directories
sonar.tests=services/auth-service/src/test/java,services/user-service/src/test/java,services/travel-service/src/test/java,services/payment-service/src/test/java,services/notification-service/src/test/java

# Java specific settings
sonar.java.source=17
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

# Coverage settings
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/generated/**,**/build/**,**/node_modules/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/test/**

# Quality gates
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8

# Duplication exclusions
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/model/**

# Issue exclusions
sonar.issue.ignore.multicriteria=e1

# Ignore certain rules for DTOs (getters/setters)
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/dto/**
