input {
  tcp {
    port => 5044
    codec => json_lines
  }
  
  beats {
    port => 5045
  }
}

filter {
  if [service] {
    mutate {
      add_field => { "[@metadata][target_index]" => "travel-%{service}-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][target_index]" => "travel-logs-%{+YYYY.MM.dd}" }
    }
  }

  # Parse Spring Boot logs
  if [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:service},%{DATA:traceId},%{DATA:spanId}\] %{NUMBER:pid} --- \[%{DATA:thread}\] %{DATA:logger} : %{GREEDYDATA:log_message}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }

  # Add correlation ID for request tracing
  if [headers][X-Correlation-ID] {
    mutate {
      add_field => { "correlationId" => "%{[headers][X-Correlation-ID]}" }
    }
  }

  # Extract HTTP request info
  if [request] {
    grok {
      match => { 
        "request" => "%{WORD:http_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}"
      }
    }
  }

  # Parse JSON payload if present
  if [payload] {
    json {
      source => "payload"
      target => "parsed_payload"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
  
  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
