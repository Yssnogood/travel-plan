version: '3.8'

# Infrastructure Services - Databases, Caching, Messaging
services:
  # PostgreSQL Database with replication support
  postgres-primary:
    image: postgres:15-alpine
    container_name: travel-postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      POSTGRES_DB: travel_db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_admin -d travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-replica:
    image: postgres:15-alpine
    container_name: travel-postgres-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      POSTGRES_DB: travel_db
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - travel-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: travel-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-travel_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./init-scripts/neo4j:/var/lib/neo4j/import
    networks:
      - travel-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: travel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # RabbitMQ for async messaging
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: travel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-travel_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mq_secret}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # HashiCorp Vault for secret management
  vault:
    image: hashicorp/vault:1.15
    container_name: travel-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-travel-vault-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - ./vault/config:/vault/config
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  travel-network:
    driver: bridge

volumes:
  postgres_primary_data:
  postgres_replica_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  rabbitmq_data:
  vault_data:
