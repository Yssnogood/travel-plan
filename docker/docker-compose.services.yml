version: '3.8'

# Microservices
services:
  # API Gateway (Kong)
  api-gateway:
    image: kong:3.4-alpine
    container_name: travel-api-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8080, 0.0.0.0:8443 ssl
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
      - ./certs:/etc/kong/certs:ro
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - auth-service
      - user-service
      - travel-service
      - payment-service
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Auth Service
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    image: travel-plan/auth-service:latest
    container_name: travel-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/travel_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-travel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-travel-vault-token}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "8081:8081"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # User Service
  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    image: travel-plan/user-service:latest
    container_name: travel-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/travel_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-travel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      AUTH_SERVICE_URL: http://auth-service:8081
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-travel-vault-token}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "8082:8082"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      - auth-service
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Travel Service
  travel-service:
    build:
      context: ../services/travel-service
      dockerfile: Dockerfile
    image: travel-plan/travel-service:latest
    container_name: travel-travel-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/travel_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-travel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-travel_neo4j}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      AUTH_SERVICE_URL: http://auth-service:8081
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-travel-vault-token}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "8083:8083"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      - auth-service
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Payment Service
  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    image: travel-plan/payment-service:latest
    container_name: travel-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/travel_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-travel_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-travel_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      AUTH_SERVICE_URL: http://auth-service:8081
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_xxx}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-xxx}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-xxx}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-travel-vault-token}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "8084:8084"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      - auth-service
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Notification Service
  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    image: travel-plan/notification-service:latest
    container_name: travel-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-travel_mq}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-mq_secret}
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-travel-vault-token}
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    ports:
      - "8085:8085"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M

  # Admin Dashboard
  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    image: travel-plan/admin-dashboard:latest
    container_name: travel-admin-dashboard
    ports:
      - "3000:80"
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    depends_on:
      - api-gateway
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M

networks:
  travel-network:
    external: true
    name: docker_travel-network
