server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: notification-service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

  rabbitmq:
    host: localhost
    port: 5672
    username: travel_admin
    password: rabbit_secret

  data:
    redis:
      host: localhost
      port: 6379
      password: redis_secret

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.travelplan: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%blue(%t)] %yellow(%logger{36}) - %msg%n"

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  
  rabbitmq:
    host: rabbitmq

  data:
    redis:
      host: redis

logging:
  level:
    root: INFO
    com.travelplan: INFO
