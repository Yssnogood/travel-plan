<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2196F3; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .footer { padding: 10px; text-align: center; font-size: 12px; color: #666; }
        .confirmation-box { background-color: #e3f2fd; padding: 15px; border-radius: 5px; margin: 15px 0; }
        .confirmation-number { font-size: 24px; font-weight: bold; color: #1976D2; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Booking Confirmed!</h1>
    </div>
    <div class="content">
        <p>Hello <span th:text="${userName}">User</span>,</p>
        <p>Great news! Your booking for <strong th:text="${travelTitle}">Trip</strong> has been confirmed.</p>
        <div class="confirmation-box">
            <p>Confirmation Number:</p>
            <p class="confirmation-number" th:text="${confirmationNumber}">ABC123</p>
        </div>
        <p>Please keep this confirmation number for your records. You can view your booking details in your dashboard.</p>
        <p>Have a wonderful trip!</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 Travel Plan. All rights reserved.</p>
    </div>
</div>
</body>
</html>
